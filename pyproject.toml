[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polybot"
version = "0.1.0"
description = "A small Polymarket threshold trading bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
  "python-dotenv",
  "requests",
  "py-clob-client-v2",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
polybot = "polybot.runner:main"
polybot-resolve = "polybot.market_resolver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polybot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
