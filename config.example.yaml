dry_run: true
mode: first_minute

first_minute:
  asset: btc
  timeframe: 5m
  poll_interval_seconds: 1
  entry_window_seconds: 60
  min_time_left_seconds: 240
  buy_usd: 10
  rules:
    - outcome: DOWN
      entry_ask: 0.36
      exit_multiplier: 2.7
      enabled: true
    - outcome: UP
      entry_ask: 0.36
      exit_multiplier: 2.7
      enabled: false

